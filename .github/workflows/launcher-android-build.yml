name: Launcher Android build

on:
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-android-build.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-android-build.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble launcher APK
        working-directory: launcher
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-debug-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
